name: KLIONS Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            ext: ""
          - name: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract KLIONS source
        shell: bash
        run: |
          set -e
          mkdir -p build-source
          unzip -q "files (15).zip" -d build-source
          TAR="$(find build-source -name 'klions-0.1.0.tar.gz' -print -quit)"
          test -n "$TAR"
          mkdir -p source
          tar -xzf "$TAR" -C source --strip-components=1
          test -f source/Cargo.toml

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        working-directory: source
        run: |
          set -e
          cargo build --release --target "${{ matrix.target }}"

      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -e
          PKG="klions-0.1.0-${{ matrix.name }}"
          mkdir -p "release/$PKG"
          cp "source/target/${{ matrix.target }}/release/klions" "release/$PKG/"
          if [ -f "source/target/${{ matrix.target }}/release/klions-lsp" ]; then
            cp "source/target/${{ matrix.target }}/release/klions-lsp" "release/$PKG/"
          fi
          cp source/README.md "release/$PKG/" 2>/dev/null || true
          cp source/LICENSE "release/$PKG/" 2>/dev/null || true
          tar -czf "release/$PKG.tar.gz" -C release "$PKG"
          sha256sum "release/$PKG.tar.gz" > "release/$PKG.tar.gz.sha256"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -e
          PKG="klions-0.1.0-${{ matrix.name }}"
          mkdir -p "release/$PKG"
          cp "source/target/${{ matrix.target }}/release/klions.exe" "release/$PKG/"
          if [ -f "source/target/${{ matrix.target }}/release/klions-lsp.exe" ]; then
            cp "source/target/${{ matrix.target }}/release/klions-lsp.exe" "release/$PKG/"
          fi
          cp source/README.md "release/$PKG/" 2>/dev/null || true
          cp source/LICENSE "release/$PKG/" 2>/dev/null || true
          7z a -ttar "release/$PKG.tar" "release/$PKG"
          7z a -tgzip "release/$PKG.tar.gz" "release/$PKG.tar"
          sha256sum "release/$PKG.tar.gz" > "release/$PKG.tar.gz.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: release/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Collect checksums
        shell: bash
        run: |
          set -e
          cd release
          cat *.sha256 > SHA256SUMS
          echo "=== RELEASE FILES ==="
          find . -type f -maxdepth 2 -printf '%p\n' | sort
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: KLIONS ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/*.sha256
            release/SHA256SUMS

      - name: SourceForge upload
        if: ${{ secrets.SOURCEFORGE_USER != '' && secrets.SOURCEFORGE_PROJECT != '' && secrets.SOURCEFORGE_SSH_KEY != '' }}
        shell: bash
        env:
          SF_USER: ${{ secrets.SOURCEFORGE_USER }}
          SF_PROJECT: ${{ secrets.SOURCEFORGE_PROJECT }}
          SF_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
        run: |
          set -e
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SF_KEY" > ~/.ssh/sourceforge_key
          chmod 600 ~/.ssh/sourceforge_key
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts
          {
            echo "mkdir $SF_PROJECT"
            echo "cd $SF_PROJECT"
            echo "mkdir ${{ github.ref_name }}"
            echo "cd ${{ github.ref_name }}"
            for f in release/*.tar.gz release/*.sha256 release/SHA256SUMS; do
              echo "put $f"
            done
          } > /tmp/sf-upload.txt
          sftp -i ~/.ssh/sourceforge_key -o StrictHostKeyChecking=yes -b /tmp/sf-upload.txt \
            "$SF_USER@frs.sourceforge.net"
